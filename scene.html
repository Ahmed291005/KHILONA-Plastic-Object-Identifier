<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KHILONA 3D factory</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eef2ff;
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif; }
  #wrap { position: relative; width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #steps { position: absolute; left: 12px; top: 12px; right: 12px; display: flex; gap: 6px;
    flex-wrap: wrap; pointer-events: none; }
  .chip { background: rgba(255,255,255,0.85); color: #64748b; border: 1px solid #e2e8f0;
    border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600;
    transition: background .25s, color .25s, border-color .25s; }
  .chip.done { color: #166534; background: #dcfce7; border-color: #bbf7d0; }
  .chip.on { color: #fff; background: #4f46e5; border-color: #4f46e5; }
  #replay { position: absolute; right: 12px; bottom: 12px; display: none; border: 0; cursor: pointer;
    background: #4f46e5; color: #fff; font: 600 14px 'Inter', 'Segoe UI', Arial, sans-serif;
    padding: 10px 18px; border-radius: 999px; box-shadow: 0 6px 16px rgba(79,70,229,.35); }
  #hint { position: absolute; left: 12px; bottom: 12px; color: #64748b; font-size: 12px; pointer-events: none; }
  #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; color: #475569; padding: 24px; font-size: 15px; }
  @media (prefers-reduced-motion: reduce) { .chip { transition: none; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="steps"></div>
  <button id="replay" type="button">Replay</button>
  <div id="hint">Drag to look around</div>
  <div id="msg">The 3D library could not load. Check your internet connection and try again.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  // ---------- which class? (app.py replaces the placeholder; standalone use: scene.html?c=0/1/2) ----------
  var RAW = '__CLASS_INDEX__';
  var q = new URLSearchParams(location.search).get('c');
  var IDX = parseInt(RAW, 10);
  if (isNaN(IDX)) IDX = (q !== null) ? parseInt(q, 10) : 0;
  var IDLE = !(IDX >= 0 && IDX <= 2);

  var wrap = document.getElementById('wrap');
  if (typeof THREE === 'undefined') { document.getElementById('msg').style.display = 'flex'; return; }

  var NAMES = ['Blue', 'Yellow', 'Purple'];
  var BELTS = ['Belt A', 'Belt B', 'Belt C'];
  var HEX = [0x2563eb, 0xfacc15, 0x7c3aed];
  var CSS = ['#2563eb', '#facc15', '#7c3aed'];
  var CSS_TEXT = ['#ffffff', '#422006', '#ffffff'];
  var LANES = [-5, 0, 5];
  var HOME = { x: 0, z: 8.2 };

  // ---------- renderer / scene / camera ----------
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch (err) { document.getElementById('msg').textContent = 'WebGL is not available in this browser.';
    document.getElementById('msg').style.display = 'flex'; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
  wrap.appendChild(renderer.domElement);
  var cv = renderer.domElement;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xeef2ff);
  scene.fog = new THREE.Fog(0xeef2ff, 40, 90);

  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
  var T = new THREE.Vector3(0, 0.6, -0.5);
  var az = 0.32, el = 0.5, R = 26;
  function updateCam() {
    camera.position.set(T.x + R * Math.sin(az) * Math.cos(el), T.y + R * Math.sin(el), T.z + R * Math.cos(az) * Math.cos(el));
    camera.lookAt(T);
  }
  function resize() {
    var w = wrap.clientWidth || 800, h = wrap.clientHeight || 500;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    R = Math.max(25, 28 / camera.aspect);
    updateCam();
  }
  window.addEventListener('resize', resize);

  var drag = null;
  cv.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; });
  cv.addEventListener('pointermove', function (e) {
    if (!drag) return;
    az -= (e.clientX - drag.x) * 0.006;
    el = Math.min(1.35, Math.max(0.15, el + (e.clientY - drag.y) * 0.005));
    drag.x = e.clientX; drag.y = e.clientY; updateCam();
  });
  function endDrag() { drag = null; cv.style.cursor = 'grab'; }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  // ---------- lights ----------
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb6c2e0, 0.8));
  var sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(8, 18, 10);
  sun.target.position.set(0, 0, -1);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -18; sun.shadow.camera.right = 18;
  sun.shadow.camera.top = 18; sun.shadow.camera.bottom = -18;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 60;
  scene.add(sun); scene.add(sun.target);

  // ---------- helpers ----------
  function mat(c, r, m) { return new THREE.MeshStandardMaterial({ color: c, roughness: r === undefined ? 0.6 : r, metalness: m || 0 }); }
  function box(w, h, d, m, x, y, z, parent) {
    var o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    o.position.set(x || 0, y || 0, z || 0);
    o.castShadow = true; o.receiveShadow = true;
    (parent || scene).add(o);
    return o;
  }
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function makeLabel(w, h, sx, sy) {
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var ctx = c.getContext('2d');
    var tex = new THREE.CanvasTexture(c);
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
    sp.scale.set(sx, sy, 1); sp.renderOrder = 10;
    sp.setText = function (text, bg, fg) {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = bg; rr(ctx, 4, 4, w - 8, h - 8, h * 0.3); ctx.fill();
      ctx.fillStyle = fg; ctx.font = '600 ' + Math.round(h * 0.4) + 'px Inter, Segoe UI, Arial, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, w / 2, h / 2 + 2);
      tex.needsUpdate = true;
    };
    return sp;
  }

  // ---------- floor, back wall, sign ----------
  var floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), mat(0xe2e8f0, 0.95));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  var grid = new THREE.GridHelper(60, 60, 0xcbd5e1, 0xd5deea);
  grid.position.y = 0.01; grid.material.transparent = true; grid.material.opacity = 0.55; scene.add(grid);
  box(46, 7, 0.3, mat(0xdbe4ff, 0.9), 0, 3.5, -13.2);
  var sign = makeLabel(768, 150, 9, 1.75);
  sign.position.set(0, 5.2, -12.9); sign.setText('KHILONA sorting factory', '#1e293b', '#ffffff'); scene.add(sign);

  // ---------- conveyor belts + chutes + gift boxes ----------
  var Z_START = 3.6, Z_END = -4.8, BELT_LEN = Z_START - Z_END, BELT_TOP = 1.64;
  var CHUTE_END_Z = -8.1, SLOPE = 0.1667, SLOPE_ANGLE = Math.atan(SLOPE);
  function chuteSurface(z) { return BELT_TOP + SLOPE * (z + 4.8); }
  var steel = mat(0x94a3b8, 0.35, 0.5);
  var belts = [];

  LANES.forEach(function (x, i) {
    var g = new THREE.Group(); g.position.set(x, 0, 0); scene.add(g);
    var zc = (Z_START + Z_END) / 2;
    var railMat = mat(HEX[i], 0.45);
    box(1.9, 0.35, BELT_LEN, mat(0x334155, 0.7), 0, 1.425, zc, g);
    box(1.7, 0.04, BELT_LEN, mat(0x1e293b, 0.9), 0, 1.62, zc, g);
    box(0.12, 0.3, BELT_LEN, railMat, -0.95, 1.7, zc, g);
    box(0.12, 0.3, BELT_LEN, railMat, 0.95, 1.7, zc, g);
    [Z_START - 0.4, Z_END + 0.4].forEach(function (lz) {
      [-0.8, 0.8].forEach(function (lx) { box(0.14, 1.25, 0.14, steel, lx, 0.625, lz, g); });
    });
    [Z_START - 0.05, Z_END + 0.05].forEach(function (rz) {
      var roller = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.8, 20), steel);
      roller.rotation.z = Math.PI / 2; roller.position.set(0, 1.5, rz); roller.castShadow = true; g.add(roller);
    });
    var stripeMat = mat(0x475569, 0.9), stripes = [], gap = 0.9, n = Math.floor(BELT_LEN / gap);
    for (var k = 0; k < n; k++) stripes.push(box(1.7, 0.02, 0.16, stripeMat, 0, 1.645, Z_END + k * gap, g));
    belts.push({ stripes: stripes, speed: 0, len: n * gap });

    // chute
    var chute = new THREE.Group();
    var midZ = (Z_START * 0 + (-4.8) + CHUTE_END_Z) / 2;
    var midY = (chuteSurface(-4.8) + chuteSurface(CHUTE_END_Z)) / 2;
    var chuteLen = Math.sqrt(3.3 * 3.3 + 0.55 * 0.55);
    chute.position.set(x, midY, midZ); chute.rotation.x = -SLOPE_ANGLE; scene.add(chute);
    box(1.9, 0.08, chuteLen, mat(0xcbd5e1, 0.3, 0.4), 0, -0.04, 0, chute);
    box(0.1, 0.25, chuteLen, railMat, -0.95, 0.09, 0, chute);
    box(0.1, 0.25, chuteLen, railMat, 0.95, 0.09, 0, chute);
    [-0.8, 0.8].forEach(function (lx) { box(0.14, 1.25, 0.14, steel, x + lx, 0.62, midZ); });

    // label above the belt end
    var lab = makeLabel(384, 110, 2.7, 0.78);
    lab.position.set(x, 3.5, -4.6);
    lab.setText(BELTS[i] + ': ' + NAMES[i], CSS[i], CSS_TEXT[i]); scene.add(lab);
  });

  var BOX_Z = -9.2;
  function makeGiftBox(i) {
    var x = LANES[i];
    var g = new THREE.Group(); g.position.set(x, 0, BOX_Z); scene.add(g);
    var m = mat(HEX[i], 0.5), rib = mat(0xffffff, 0.5);
    box(2, 0.1, 2, m, 0, 0.05, 0, g);
    box(0.08, 0.9, 2, m, -0.96, 0.45, 0, g);
    box(0.08, 0.9, 2, m, 0.96, 0.45, 0, g);
    box(2, 0.9, 0.08, m, 0, 0.45, 0.96, g);
    box(2, 0.9, 0.08, m, 0, 0.45, -0.96, g);
    box(1.84, 0.02, 1.84, mat(0xfff7ed, 0.95), 0, 0.11, 0, g);
    box(0.3, 0.9, 0.02, rib, 0, 0.45, 1.0, g);
    box(0.02, 0.9, 0.3, rib, -1.0, 0.45, 0, g);
    box(0.02, 0.9, 0.3, rib, 1.0, 0.45, 0, g);
    var lid = new THREE.Group(); lid.position.set(0, 0.9, -1.0); g.add(lid);
    box(2.14, 0.22, 2.14, m, 0, 0.11, 1.0, lid);
    box(0.3, 0.24, 2.14, rib, 0, 0.12, 1.0, lid);
    box(2.14, 0.24, 0.3, rib, 0, 0.12, 1.0, lid);
    [-1, 1].forEach(function (s) {
      var loop = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.06, 10, 24), rib);
      loop.position.set(s * 0.22, 0.38, 1.0); loop.rotation.z = -s * 0.5; loop.castShadow = true; lid.add(loop);
    });
    var knot = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), rib);
    knot.position.set(0, 0.32, 1.0); lid.add(knot);
    var open = (i === IDX);
    lid.rotation.x = open ? -1.8 : 0;
    return { g: g, lid: lid };
  }
  var giftBoxes = [0, 1, 2].map(makeGiftBox);

  // ---------- table + toy brick ----------
  var wood = mat(0xd6a76b, 0.7);
  box(2.6, 0.12, 1.4, wood, 0, 1.34, 6.9);
  [[-1.2, 6.3], [1.2, 6.3], [-1.2, 7.5], [1.2, 7.5]].forEach(function (p) { box(0.12, 1.28, 0.12, mat(0x8a5a2b, 0.8), p[0], 0.64, p[1]); });
  var pad = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.02, 32), mat(0xffffff, 0.9));
  pad.position.set(0.6, 1.41, 7.18); pad.receiveShadow = true; scene.add(pad);

  var obj = new THREE.Group();
  (function () {
    var c = IDLE ? 0x94a3b8 : HEX[IDX];
    var m = mat(c, 0.35);
    var body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), m); body.castShadow = true; obj.add(body);
    [-0.17, 0.17].forEach(function (sx) { [-0.17, 0.17].forEach(function (sz) {
      var stud = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.09, 16), m);
      stud.position.set(sx, 0.395, sz); stud.castShadow = true; obj.add(stud);
    }); });
    obj.visible = false; scene.add(obj);
  })();

  // ---------- the person ----------
  var person = new THREE.Group(); person.position.set(HOME.x, 0, HOME.z); scene.add(person);
  var skin = mat(0xf2c9a0, 0.7), shirt = mat(0x6366f1, 0.6), pants = mat(0x334155, 0.7), shoe = mat(0x0f172a, 0.8);
  var legs = [];
  [-0.22, 0.22].forEach(function (lx) {
    var p = new THREE.Group(); p.position.set(lx, 1.0, 0); person.add(p);
    box(0.3, 1.0, 0.34, pants, 0, -0.5, 0, p); box(0.32, 0.14, 0.5, shoe, 0, -0.95, -0.08, p); legs.push(p);
  });
  box(0.95, 1.1, 0.52, shirt, 0, 1.55, 0, person);
  var head = new THREE.Mesh(new THREE.SphereGeometry(0.36, 24, 18), skin); head.position.set(0, 2.5, 0); head.castShadow = true; person.add(head);
  var hair = new THREE.Mesh(new THREE.SphereGeometry(0.385, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.55), mat(0x1f2937, 0.8));
  hair.position.set(0, 2.52, 0.02); person.add(hair);
  [-0.13, 0.13].forEach(function (ex) {
    var eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), mat(0x0f172a, 0.4));
    eye.position.set(ex, 2.53, -0.33); person.add(eye);
  });
  function makeArm(sx) {
    var pivot = new THREE.Group(); pivot.position.set(sx * 0.6, 2.0, 0); person.add(pivot);
    box(0.28, 0.55, 0.28, shirt, 0, -0.275, 0, pivot);
    box(0.22, 0.5, 0.22, skin, 0, -0.8, 0, pivot);
    var hand = new THREE.Object3D(); hand.position.set(0, -1.05, 0); pivot.add(hand);
    var ball = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 10), skin); ball.castShadow = true; hand.add(ball);
    return { pivot: pivot, hand: hand };
  }
  var armL = makeArm(-1), armR = makeArm(1);
  var bubble = makeLabel(640, 130, 4.6, 0.94);
  bubble.position.set(0, 3.6, 0); person.add(bubble);

  // ---------- step chips ----------
  var STEPS = ['Image received', 'Pick up', 'Carry', 'On the belt', 'Slide down', 'Packed in gift box'];
  var chipBox = document.getElementById('steps'), chips = [];
  STEPS.forEach(function (s, i) {
    var c = document.createElement('div'); c.className = 'chip'; c.textContent = (i + 1) + '. ' + s;
    chipBox.appendChild(c); chips.push(c);
  });
  function setStep(n) {
    chips.forEach(function (c, i) { c.className = 'chip' + (i < n ? ' done' : (i === n ? ' on' : '')); });
  }
  function say(text) { bubble.setText(text, IDLE ? '#64748b' : CSS[IDX], IDLE ? '#ffffff' : CSS_TEXT[IDX]); }

  // ---------- tiny tween engine ----------
  var clock = new THREE.Clock(), tasks = [];
  var linear = function (p) { return p; };
  var easeInOut = function (p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; };
  var easeIn = function (p) { return 0.4 * p + 0.6 * p * p; };
  var easeBounce = function (x) {
    var n1 = 7.5625, d1 = 2.75;
    if (x < 1 / d1) return n1 * x * x;
    if (x < 2 / d1) { x -= 1.5 / d1; return n1 * x * x + 0.75; }
    if (x < 2.5 / d1) { x -= 2.25 / d1; return n1 * x * x + 0.9375; }
    x -= 2.625 / d1; return n1 * x * x + 0.984375;
  };
  function tween(dur, fn, ease) {
    return new Promise(function (res) { tasks.push({ t: 0, dur: Math.max(dur, 0.0001), fn: fn, ease: ease || linear, res: res }); });
  }
  function sleep(s) { return tween(s, function () {}); }
  function moveArm(arm, to, dur) {
    var from = arm.pivot.rotation.x;
    return tween(dur, function (e) { arm.pivot.rotation.x = from + (to - from) * e; }, easeInOut);
  }
  function turnTo(a, dur) {
    var f = person.rotation.y, d = a - f;
    while (d > Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;
    return tween(dur, function (e) { person.rotation.y = f + d * e; }, easeInOut);
  }
  var walking = false, walkPhase = 0, rightFree = true, carrying = false;
  function walkTo(tx, tz) {
    var sx = person.position.x, sz = person.position.z, dx = tx - sx, dz = tz - sz;
    var dist = Math.hypot(dx, dz);
    return turnTo(Math.atan2(-dx, -dz), 0.25).then(function () {
      walking = true;
      return tween(dist / 3.2, function (e) { person.position.x = sx + dx * e; person.position.z = sz + dz * e; });
    }).then(function () { walking = false; });
  }

  // ---------- confetti ----------
  var confetti = [], confettiGeo = new THREE.PlaneGeometry(0.16, 0.16);
  var confettiMats = [0x2563eb, 0xfacc15, 0x7c3aed, 0xf472b6, 0x34d399].map(function (c) {
    return new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide });
  });
  function burst(x, y, z) {
    for (var i = 0; i < 80; i++) {
      var m = new THREE.Mesh(confettiGeo, confettiMats[i % confettiMats.length]);
      m.position.set(x, y, z); m.rotation.set(Math.random() * 6, Math.random() * 6, 0); scene.add(m);
      confetti.push({ m: m, v: new THREE.Vector3((Math.random() - 0.5) * 7, 5 + Math.random() * 5, (Math.random() - 0.5) * 7), spin: (Math.random() - 0.5) * 12 });
    }
  }

  // ---------- per-frame update ----------
  var tmp = new THREE.Vector3();
  function update(dt) {
    tasks.slice().forEach(function (k) {
      k.t += dt;
      var p = Math.min(k.t / k.dur, 1);
      k.fn(k.ease(p), p);
      if (p >= 1) { tasks.splice(tasks.indexOf(k), 1); k.res(); }
    });
    belts.forEach(function (b) {
      if (b.speed <= 0) return;
      b.stripes.forEach(function (s) { s.position.z -= b.speed * dt; if (s.position.z < Z_END) s.position.z += b.len; });
    });
    if (walking) {
      walkPhase += dt * 9;
      var s = Math.sin(walkPhase);
      legs[0].rotation.x = s * 0.7; legs[1].rotation.x = -s * 0.7;
      armL.pivot.rotation.x = -s * 0.6;
      if (rightFree) armR.pivot.rotation.x = s * 0.6;
      person.position.y = Math.abs(Math.cos(walkPhase)) * 0.06;
    } else {
      legs[0].rotation.x *= 0.8; legs[1].rotation.x *= 0.8; armL.pivot.rotation.x *= 0.85;
      if (rightFree) armR.pivot.rotation.x *= 0.85;
      person.position.y *= 0.8;
    }
    if (carrying) {
      person.updateMatrixWorld(true);
      armR.hand.getWorldPosition(tmp);
      obj.position.copy(tmp); obj.rotation.set(0, person.rotation.y, 0);
    }
    for (var i = confetti.length - 1; i >= 0; i--) {
      var c = confetti[i];
      if (c.m.position.y > 0.03) {
        c.v.y -= 14 * dt; c.m.position.addScaledVector(c.v, dt);
        c.m.rotation.x += c.spin * dt; c.m.rotation.z += c.spin * dt;
        if (c.m.position.y < 0.03) c.m.position.y = 0.03;
      }
    }
  }
  function loop() {
    requestAnimationFrame(loop);
    update(Math.min(clock.getDelta(), 0.05));
    renderer.render(scene, camera);
  }

  // ---------- the story ----------
  async function run() {
    var L = LANES[IDX], gb = giftBoxes[IDX], belt = belts[IDX];
    await sleep(0.8);
    setStep(0); say(NAMES[IDX] + ' detected: ' + BELTS[IDX]);
    obj.visible = true; obj.position.set(0.6, 6, 7.18);
    await tween(0.9, function (e) { obj.position.y = 6 + (1.75 - 6) * e; }, easeBounce);
    await sleep(0.5);

    setStep(1);
    rightFree = false;
    await moveArm(armR, 1.33, 0.7);
    carrying = true;
    await moveArm(armR, 1.5, 0.4);

    setStep(2); say('Taking it to ' + BELTS[IDX]);
    await walkTo(2.4, HOME.z);
    await walkTo(2.4, 4.0);
    await walkTo(L - 0.5, 4.0);
    await turnTo(0, 0.3);

    setStep(3); say('Placing it on ' + BELTS[IDX]);
    await moveArm(armR, Math.PI / 2, 0.5);
    carrying = false;
    var s0 = obj.position.clone();
    await tween(0.25, function (e) {
      obj.position.set(s0.x + (L - s0.x) * e, s0.y + (BELT_TOP + 0.35 - s0.y) * e, s0.z);
      obj.rotation.set(0, obj.rotation.y * (1 - e), 0);
    });

    var back = (async function () {
      await moveArm(armR, 0.05, 0.5);
      rightFree = true;
      await walkTo(2.4, 4.0);
      await walkTo(2.4, HOME.z);
      await walkTo(HOME.x, HOME.z);
      await turnTo(0, 0.4);
      say('Next object, please');
    })();

    belt.speed = 2.0;
    var zA = obj.position.z, zB = -4.7;
    await tween(Math.abs(zB - zA) / 2.0, function (e) { obj.position.z = zA + (zB - zA) * e; });
    belt.speed = 0;

    setStep(4);
    var z1 = -8.0;
    await tween(1.3, function (e) {
      var z = zB + (z1 - zB) * e;
      obj.position.z = z; obj.position.y = chuteSurface(z) + 0.37;
      obj.rotation.x = -SLOPE_ANGLE * Math.min(1, e * 4);
    }, easeIn);

    var y0 = obj.position.y;
    await tween(0.75, function (p) {
      var zp = 1 - (1 - p) * (1 - p);
      obj.position.z = z1 + (BOX_Z - z1) * zp;
      obj.position.y = y0 + (0.46 - y0) * p * p;
      obj.rotation.x = -SLOPE_ANGLE * (1 - p);
      obj.rotation.y = 0.6 * p;
    });
    await sleep(0.35);

    setStep(5);
    await tween(1.0, function (e) { gb.lid.rotation.x = -1.8 * (1 - e); }, easeBounce);
    await tween(0.5, function (p) { gb.g.position.y = 0.4 * Math.sin(Math.PI * p); });
    burst(L, 1.2, BOX_Z);
    say('Packed in a gift box!');
    setStep(6);
    document.getElementById('replay').style.display = 'block';
    await back;
  }

  // ---------- start ----------
  document.getElementById('replay').addEventListener('click', function () { location.reload(); });
  resize();
  if (IDLE) { say('Waiting for an image...'); setStep(-1); } else { setStep(-1); }
  loop();
  if (!IDLE) run();
})();
</script>
</body>
</html>
